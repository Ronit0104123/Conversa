[build]
builder = 'nixpacks'
buildCommand = 'apt-get update && for p in libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libatspi2.0-0t64 libcups2t64 libasound2t64 libglib2.0-0t64 libdbus-1-3 libdrm2 libgbm1 libcairo2 libpango-1.0-0 libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2; do apt-get install -y --no-install-recommends "$p"; done; pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt && PLAYWRIGHT_BROWSERS_PATH=0 python -m playwright install chromium'
