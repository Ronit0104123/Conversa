[build]
builder = "nixpacks"
buildCommand = "pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt && python -m playwright install chromium"

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
